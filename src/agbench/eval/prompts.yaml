# Prompt templates. {crop} is the resolved crop phrase ("tomato plant", "bean or cowpea plant", "plant").

mcqa: "Classify this image of {a_crop} into one of the following categories: {options}. Respond with ONLY the category name, nothing else."
nota: "None of the above"
idk: "I don't know"

oeq:
  disease: "Respond in one sentence: What disease, pest, damage type, or other stress, if any, is exhibited in this image of {a_crop}?"
  pest_damage: "Respond in one sentence: What disease, pest, damage type, or other stress, if any, is exhibited in this image of {a_crop}?"
  quality_maturity: "Respond in one sentence: What quality, ripeness, or condition is exhibited in this image of {a_crop}?"
  species_id: "Respond in one sentence: What plant or weed species, if any, is shown in this image?"
  localization: "Respond in one sentence: What is shown in this image of {a_crop}?"
  other: "Respond in one sentence: What category best describes this image of {a_crop}?"

# Coordinate order named in the grounding prompt; models.yaml `box_order` picks one per model.
box_orders:
  yxyx: "[y_min, x_min, y_max, x_max]"
  xyxy: "[x_min, y_min, x_max, y_max]"

grounding: |
  Identify and localize every {class_names} visible in this image of {a_crop}. Respond with
  ONLY a JSON array, one object per instance found, each with exactly these
  two keys:
  "box_2d": {box_order} — coordinates on a 0-1000
  normalized scale (top-left corner of the image is [0, 0]), in that exact
  order.
  "label": the class name for that instance, chosen from: {class_names}.

  If none are visible, respond with exactly: []

itt_suffix:
  multiple_choice: "Respond with ONLY the letter of the correct option (or letters, comma-separated, if more than one is correct)."
  yes_no: "Respond with ONLY yes or no."
  numeric: "Respond with ONLY the number."
  open_ended: ""

# Models without native thinking get this system prompt.
cot_system: "Think through the problem step by step inside <think></think> tags. Then give your final answer inside <answer></answer> tags, following the requested answer format exactly."

judge_system: "You are an expert agricultural scientist evaluating model predictions against reference answers."

# v4 (2026-11-09), tuned against the oracle labels; v3 kept below.
judge_classification: |
  Evaluate whether the predicted label correctly and SPECIFICALLY identifies the plant condition in the reference. For context, here is the full list of possible classes for this dataset — use it to judge whether the prediction is specific enough to distinguish the reference class from the other listed classes, not just broadly consistent with it:
  {class_list}
  The prediction does NOT need to use the reference class's exact wording. Mark is_match true if the prediction names a specific instance or subtype that NECESSARILY belongs to the reference class and no other class in the list — for example, a specific named defect is a valid match for a broad catch-all class like 'Bad', since any such defect is always a case of that class. Do NOT mark is_match true if the prediction is instead a plausible CAUSE or commonly-associated diagnosis offered for a generically-described reference class (e.g. a specific pathogen name given as an explanation for a reference class that is itself only a symptom description) — many different, unrelated specific causes can produce the same generic symptom, so naming one specific cause is a guess, not a necessary membership relationship, and must not be credited. A generic symptom-shape label (e.g. "leaf spot disease", "nutrient deficiency", "viral infection", "fungal infection") also does NOT count as a match for a specifically-named reference class just because it is broadly consistent with it. However, if the prediction and reference class are different wordings of the SAME underlying condition (e.g. different phrasings of "healthy," or a synonym/abbreviation for the identical class), mark is_match true — this is not the generic-label case above, since there is no ambiguity about which condition is meant. Separately, a prediction that is itself generic or category-level (for example "insect damage", "viral infection", "leaf spot", "fruit rot", "fern", "grass") is a match only if exactly ONE class in {class_list} fits it. If any other listed class could also fit, mark is_match false. When several classes could fit, use the prediction's own description of the symptoms as a tie-breaker: if the described symptoms clearly point to exactly one of those classes, mark is_match true. An uninformative answer (for example "weed", "pest", "defective") follows the same rule. Cause versus symptom: if the reference class names a symptom or condition (for example Dried, Yellow, Holed, dead heart, Spotted), a SPECIFIC cause, pest, pathogen or stress (for example "stem borer", "nutrient deficiency", "drought stress", "anthracnose") is NOT a match, even if it could plausibly produce that symptom. A generic category such as "insect damage" is still judged by the rule above. Neighbouring states: condition words are different classes even when they sound similar. Wilted, dried, withered, shriveled, spoiled, rotten, overripe, diseased, damaged and mechanical damage are NOT interchangeable. Match only the same term or a true synonym (for example unripe and immature). "Healthy" matches a class that means healthy, normal, fresh, good or disease free. Do not invent meanings for grade, stage, severity or numeric class names - the prediction must use that class's own terms or an unambiguous equivalent. Related species, pathogens and diseases: a different species, genus, pathogen or disease than the reference class is a mismatch. Belonging to the same family, genus or look-alike group is NOT enough. The only exception is a universally accepted synonym or common name of the same organism or disease (for example pennywort and Centella asiatica).
  Reference class: {gt}
  Prediction: {pred}
  Respond with JSON only:
  {{ "is_match": true/false, "reasoning": "brief explanation — if crediting a non-exact match, state why the prediction necessarily belongs to the reference class rather than merely being a plausible cause or generic description", "confidence": 0-2 }}
  confidence: 0=not confident, 1=somewhat confident, 2=very confident

judge_classification_v3: |
  Evaluate whether the predicted label correctly and SPECIFICALLY identifies the plant condition in the reference. For context, here is the full list of possible classes for this dataset — use it to judge whether the prediction is specific enough to distinguish the reference class from the other listed classes, not just broadly consistent with it:
  {class_list}

  The prediction does NOT need to use the reference class's exact wording. Mark is_match true if the prediction names a specific instance or subtype that NECESSARILY belongs to the reference class and no other class in the list. Do NOT mark is_match true if the prediction is instead a plausible CAUSE or commonly-associated diagnosis offered for a generically-described reference class. A generic symptom-shape label (e.g. "leaf spot disease", "nutrient deficiency", "viral infection", "fungal infection") also does NOT count as a match for a specifically-named reference class just because it is broadly consistent with it.

  Reference class: {gt}
  Prediction: {pred}

  Respond with JSON only:
  {{"is_match": true/false, "reasoning": "brief explanation"}}

judge_qa: |
  Evaluate whether the model answer to the question below is correct, using the reference answer as ground truth. The model answer does not need the same wording or level of detail, but its key facts and conclusion must agree with the reference and it must not contradict it.

  Question: {question}
  Reference answer: {gt}
  Model answer: {pred}

  Respond with JSON only:
  {{"is_match": true/false, "reasoning": "brief explanation"}}
