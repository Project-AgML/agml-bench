# Model registry. Settings follow each HF model card.
#   thinking:  request fields that turn thinking on (merged into the request body)
#   effort:    request fields per --reasoning-effort level
#   cot:       true -> no native thinking; use the CoT system prompt and <answer> tags
#   config_overlay: {repo, files}: serve a copy of the snapshot with these files taken from another repo
#   parallel:  llama-server slots (-np); each gets max_model_len context
#   est_vram_gb: estimated single-GPU peak (weights + vision + KV at 32K, fp8 KV)

defaults:
  max_model_len: 32768
  max_tokens: 16384
  concurrency: 32
  max_num_seqs: 64   # vLLM; above concurrency, below hybrid models' Mamba cache limit
  max_images: 8
  gpu_memory_utilization: 0.92

judge: RedHatAI/gemma-4-31B-it-FP8-dynamic

models:
  google/gemma-4-12B-it:
    backend: vllm
    weights_gb: 23.9
    est_vram_gb: 33
    serve_args: [--reasoning-parser, gemma4, --kv-cache-dtype, fp8]
    sampling: {temperature: 1.0, top_p: 0.95, top_k: 64}
    thinking: {chat_template_kwargs: {enable_thinking: true}}
    no_thinking: {chat_template_kwargs: {enable_thinking: false}}

  RedHatAI/gemma-4-31B-it-FP8-dynamic:
    backend: vllm
    weights_gb: 33.3
    est_vram_gb: 42
    serve_args: [--reasoning-parser, gemma4, --kv-cache-dtype, fp8]
    sampling: {temperature: 1.0, top_p: 0.95, top_k: 64}
    thinking: {chat_template_kwargs: {enable_thinking: true}}
    no_thinking: {chat_template_kwargs: {enable_thinking: false}}

  Qwen/Qwen3.8-27B-FP8:
    backend: vllm
    weights_gb: 30.9
    est_vram_gb: 39
    serve_args: [--reasoning-parser, qwen3, --kv-cache-dtype, fp8]
    sampling: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0}
    thinking: {chat_template_kwargs: {enable_thinking: true, preserve_thinking: false}}
    no_thinking: {chat_template_kwargs: {enable_thinking: false}}
    effort:
      low: {reasoning_effort: low}
      medium: {reasoning_effort: medium}
      high: {reasoning_effort: xhigh}
    bbox_key_format: {bbox_2d: xyxy_1000}

  Qwen/Qwen3.6-35B-A3B-FP8:
    backend: vllm
    weights_gb: 37.5
    est_vram_gb: 45
    serve_args: [--reasoning-parser, qwen3, --kv-cache-dtype, fp8,
                 --speculative-config, '{"method":"qwen3_next_mtp","num_speculative_tokens":2}']
    sampling: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0, presence_penalty: 1.5}
    thinking: {chat_template_kwargs: {enable_thinking: true}}
    no_thinking: {chat_template_kwargs: {enable_thinking: false}}
    bbox_key_format: {bbox_2d: xyxy_1000}

  mistralai/Ministral-3-14B-Instruct-2512:
    backend: vllm
    weights_gb: 15.7
    est_vram_gb: 23
    serve_args: [--tokenizer-mode, mistral, --config-format, mistral, --load-format, mistral, --kv-cache-dtype, fp8]
    sampling: {temperature: 0.1}
    cot: true

  nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB-GGUF:
    backend: llamacpp  # the vLLM 24GB checkpoint needs Blackwell (b12x kernels); llama.cpp runs IQ2 on Ada
    weights_gb: 23.7
    est_vram_gb: 28
    parallel: 2
    gguf: NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB.gguf
    mmproj: mmproj-NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB.gguf
    draft: {repo: nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB-LiLiCorr-GGUF, file: NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB-LiLiCorr.gguf}
    serve_args: [--spec-type, draft-dflash, --spec-draft-n-max, "6", --spec-draft-ngl, "999",
                 --cache-type-k, q8_0, --cache-type-v, q8_0, --batch-size, "2048", --ubatch-size, "512"]
    draft_flag: --spec-draft-model
    sampling: {temperature: 1.0, top_p: 0.95}
    thinking: {chat_template_kwargs: {enable_thinking: true}}
    no_thinking: {chat_template_kwargs: {enable_thinking: false}}
    effort:
      low: {chat_template_kwargs: {enable_thinking: true, medium_effort: true}}
      medium: {chat_template_kwargs: {enable_thinking: true, medium_effort: true}}
      high: {}

  RedHatAI/Muse-Glimmer-30B-FP8-block:
    backend: vllm
    weights_gb: 34.4
    est_vram_gb: 42
    serve_args: [--reasoning-parser, muse_glimmer, --kv-cache-dtype, fp8]
    sampling: {temperature: 1.0, top_p: 0.95, top_k: 64}
    thinking: {}  # always on
    no_thinking: {chat_template_kwargs: {reasoning_strength: low}}
    effort:
      low: {chat_template_kwargs: {reasoning_strength: low}}
      medium: {chat_template_kwargs: {reasoning_strength: medium}}
      high: {chat_template_kwargs: {reasoning_strength: high}}

  openbmb/MiniCPM-V-4.7-35B-A3B-FP8:
    backend: vllm
    weights_gb: 38.0
    est_vram_gb: 45
    serve_args: [--reasoning-parser, minicpmv, --kv-cache-dtype, fp8]
    # the quantized repos' processor configs point at processing_*.py files they don't ship; use the base repo's
    config_overlay: {repo: openbmb/MiniCPM-V-4.7-35B-A3B, files: [processor_config.json, preprocessor_config.json, tokenizer_config.json]}
    sampling: {temperature: 0.7, top_p: 0.95, top_k: 100, min_p: 0.0, repetition_penalty: 1.03}
    thinking: {chat_template_kwargs: {enable_thinking: true}}
    no_thinking: {chat_template_kwargs: {enable_thinking: false}}
