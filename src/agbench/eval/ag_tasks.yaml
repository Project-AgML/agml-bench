# Ag-task bucket per class. Resolution order:
#   datasets.<name>.class_overrides -> datasets.<name>.task_type -> agricultural_task (catalog) -> name keywords -> other
# ITT samples use itt rules (per-sample strata field, then dataset default).

buckets: [disease, pest_damage, quality_maturity, species_id, localization, other]

agricultural_task:
  disease_classification: disease
  disease_detection: disease
  disease_segmentation: disease
  damage_classification: pest_damage
  forest_damage_detection: pest_damage
  quality_classification: quality_maturity
  maturity_classification: quality_maturity
  maturity_detection: quality_maturity
  crop_classification: species_id
  variety_classification: species_id
  weed_classification: species_id
  plant_classification: species_id
  weed_detection: species_id
  weed_segmentation: species_id
  crop_and_weed_segmentation: species_id
  crop_detection: localization
  crop_segmentation: localization
  plant_organ_segmentation: localization
  root_segmentation: other
  land_use_classification: other
  land_use_segmentation: other
  crop_phenotyping: other

# Used when agricultural_task is missing. First match wins.
name_keywords:
  - [pest|insect|bug|whitefly|coccinellid|spittlebug|aphid|mite, pest_damage]
  - [weed, species_id]
  - [disease|blight|rust, disease]
  - [ripe|maturity|quality|grade, quality_maturity]
  - [tree_crown|plant_part|fruit|flower, localization]

# Class names that suggest pest/abiotic damage; `agbench eval check-agtasks` lists hits without an override.
pest_keywords: insect|\bpests?\b|mite|aphid|beetle|borer|weevil|\bbug|caterpillar|thrip|miner|hopper|jassid|whitefly|mealy|worm|moth|larva|locust|grasshopper|midge|looper|deficien|toxicity|sunburn|herbicide|nematode

itt:
  AgroBench: {field: source, map: {did: disease, dmn: disease, pid: pest_damage, wid: species_id, cmn: species_id, mqa: other, tm: other}}
  MIRAGE:
    field: category
    contains: {Disease: disease, Pest: pest_damage, Weed: species_id, Identification: species_id}
    default: other
  AgroOmni: {field: category, map: {Leaf_diseases: disease, Pest: pest_damage, Fruit: quality_maturity, Tomato: quality_maturity, Wheat: quality_maturity, crop: species_id, Trees: species_id}, default: other}
  AgroMind: {field: task, map: {PDD: disease}, default: other}
  AgroCoT: {field: type_id, map: {"10": disease, "3": disease}, default: other}
  TomaMMU: {field: question_type, map: {CSI: species_id, DC: disease, HDC: disease, PC: disease, SI: disease, SNC: disease}, default: other}
  PlantMicro: {field: question_type, map: {class: disease, specie: species_id}, default: other}
  WisWheat: {field: config, map: {Instruct_Finetune: disease}, default: other}
  PlantExpertVQA: {default: disease}
  CDDM: {default: disease}
  LeafNet: {default: disease}
  Agri-LLaVA: {default: disease}
  AgriBench: {default: other}

