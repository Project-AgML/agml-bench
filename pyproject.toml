[project]
name = "agbench"
version = "1.0.0"
description = "Benchmark vision-language models on AgML agricultural datasets"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "eranario", email = "ewranario@ucdavis.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "httpx>=0.28.1",
    "huggingface-hub>=2.2.0",
    "numpy>=2.5.4",
    "nvidia-ml-py>=13.615.71",
    "openai>=3.36.0",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "streamlit>=1.66.0",
    "tabulate>=0.10.0",
    "typer>=0.27.3",
]

[project.urls]
Repository = "https://github.com/Project-AgML/agml-benchmarks"
Issues = "https://github.com/Project-AgML/agml-benchmarks/issues"
AgML = "https://github.com/Project-AgML/AgML"

[project.optional-dependencies]
# Few-shot YOLO11 baselines (agbench eval yolo)
yolo = ["ultralytics>=8.3.0"]
# PNG figures (agbench eval report --figures)
viz = ["matplotlib>=3.11"]

[project.scripts]
agbench = "agbench.cli:app"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 130
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E702", "E731", "E741"]
